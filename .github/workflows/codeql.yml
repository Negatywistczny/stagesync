name: "CodeQL"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'data/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'data/**'
  schedule:
    - cron: '30 3 * * 1' # Co poniedziałek o 03:30 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Inicjalizacja CodeQL z zestawem reguł security-extended oraz wykluczeniami ścieżek
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended
        config: |
          paths-ignore:
            - 'data'
            - 'docs'
            - '**/dist'
            - '**/build'
            - '**/coverage'
            - '**/node_modules'
            - '**/.turbo'

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
