name: "CodeQL"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'data/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'data/**'
  schedule:
    - cron: '30 3 * * 1' # Co poniedziałek o 03:30 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Inicjalizacja CodeQL z zestawem reguł security-extended oraz zewnętrzne pliki konfiguracyjne / config-file (aktualizacja do Action v4)
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: security-extended
        config-file: .github/codeql/codeql-config.yml

    - name: Build Java/Kotlin (Gradle)
      if: matrix.language == 'java-kotlin'
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assemble
        elif [ -f "apps/console/android/gradlew" ]; then
          cd apps/console/android
          chmod +x gradlew
          ./gradlew assemble
        fi

    - name: Perform CodeQL Analysis
>>>>>>>
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
