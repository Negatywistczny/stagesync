name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 5.0.0) — no git commit"
        required: true
        default: "5.0.0"
      publish:
        description: "Create/publish GitHub Release (false = build artifacts only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/negatywistczny/stagesync
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-version:
    name: resolve-version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

  docker:
    name: docker-ghcr
    runs-on: ubuntu-latest
    needs: resolve-version
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-draft-release:
    name: create-draft-release
    runs-on: ubuntu-latest
    needs: resolve-version
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create draft GitHub Release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ env.VERSION }}"
          REPO="${{ github.repository }}"
          NOTES_FILE="$(mktemp)"
          node scripts/build-release-notes.mjs "${{ env.VERSION }}" > "$NOTES_FILE"
          TITLE="$(node scripts/release-title.mjs "${{ env.VERSION }}")"

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — refreshing notes/title for asset upload"
            gh release edit "$TAG" \
              -R "$REPO" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              -R "$REPO" \
              --draft \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          fi
          # drafts are invisible to /releases/tags/{tag}; use gh view (works for draft + published)
          ID=$(gh release view "$TAG" -R "$REPO" --json databaseId --jq .databaseId)
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "Failed to resolve release id for $TAG" >&2
            exit 1
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  tauri-macos:
    name: tauri-macos-dmg
    runs-on: macos-latest
    needs: [resolve-version, create-draft-release]
    if: always() && needs.resolve-version.result == 'success' && (needs.create-draft-release.result == 'success' || needs.create-draft-release.result == 'skipped')
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version into files
        run: node scripts/sync-version.mjs --version ${{ env.VERSION }}

      - name: Build desktop sidecar (Node + server + web)
        run: node apps/desktop/scripts/build-desktop-sidecar.mjs --target aarch64-apple-darwin --smoke

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # pnpm deploy --prod (sidecar) marks workspace production-only; restore
      # so tauri-action still finds @tauri-apps/cli (devDependency).
      - name: Restore JS deps after sidecar deploy
        shell: bash
        run: |
          rm -f node_modules/.pnpm-workspace-state-v1.json
          pnpm install --frozen-lockfile

      - name: Build Tauri (macOS — dmg + updater)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          uploadUpdaterJson: true
          releaseId: ${{ (github.event_name == 'push' || inputs.publish) && needs.create-draft-release.outputs.release_id || '' }}

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  tauri-windows:
    name: tauri-windows-msi
    runs-on: windows-latest
    needs: [resolve-version, create-draft-release]
    if: always() && needs.resolve-version.result == 'success' && (needs.create-draft-release.result == 'success' || needs.create-draft-release.result == 'skipped')
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Windows paths (WiX)
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          subst X: $env:GITHUB_WORKSPACE
          "GITHUB_WORKSPACE=X:\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version into files
        run: node scripts/sync-version.mjs --version ${{ env.VERSION }} --wix-compat

      - name: Build desktop sidecar (Node + server + web)
        run: node apps/desktop/scripts/build-desktop-sidecar.mjs --target x86_64-pc-windows-msvc --smoke

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Restore JS deps after sidecar deploy
        shell: bash
        run: |
          rm -f node_modules/.pnpm-workspace-state-v1.json
          pnpm install --frozen-lockfile

      - name: Build Tauri (Windows — msi + updater)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUST_LOG: tauri_bundler=debug
        with:
          projectPath: apps/desktop
          uploadUpdaterJson: true
          args: --verbose
          releaseId: ${{ (github.event_name == 'push' || inputs.publish) && needs.create-draft-release.outputs.release_id || '' }}

      - name: Rename MSI without locale suffix
        shell: bash
        run: |
          set -euo pipefail
          MSI_DIR="apps/desktop/src-tauri/target/release/bundle/msi"
          shopt -s nullglob
          # WiX/Tauri may emit StageSync_*_x64_en-US.msi or *_x64_pl-PL.msi
          for f in "$MSI_DIR"/*.msi; do
            base="$(basename "$f")"
            # Strip trailing _xx-YY locale before .msi
            dest_base="$(echo "$base" | sed -E 's/_[a-z]{2}-[A-Z]{2}\.msi$/.msi/')"
            # Normalize arch token if present as x86_64
            dest_base="${dest_base/_x86_64./_x64.}"
            if [ "$base" != "$dest_base" ]; then
              mv "$f" "$MSI_DIR/$dest_base"
              echo "Renamed $base → $dest_base"
            fi
          done

      - name: Upload msi artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android-performer:
    name: android-performer-apk
    runs-on: ubuntu-latest
    needs: [resolve-version, create-draft-release]
    if: always() && needs.resolve-version.result == 'success' && (needs.create-draft-release.result == 'success' || needs.create-draft-release.result == 'skipped')
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version into files
        run: node scripts/sync-version.mjs --version ${{ env.VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform + build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Write local.properties
        working-directory: apps/performer/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build shared + Performer web assets
        run: |
          pnpm --filter @stagesync/shared build
          if [ ! -f apps/web/dist-performer/index.html ]; then
            pnpm --filter @stagesync/web build
          fi
          test -f apps/web/dist-performer/index.html

      - name: Assemble Performer release APK
        working-directory: apps/performer/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name artifact
        run: |
          set -euo pipefail
          SRC="apps/performer/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            SRC="apps/performer/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          DEST="StageSync-Performer-v${VERSION}.apk"
          cp "$SRC" "$DEST"
          ls -la "$DEST"

      - name: Upload Performer APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-performer-apk
          path: StageSync-Performer-v${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          gh release upload "$TAG" "StageSync-Performer-v${VERSION}.apk" -R "${{ github.repository }}" --clobber

  android-console:
    name: android-console-apk
    runs-on: ubuntu-latest
    needs: [resolve-version, create-draft-release]
    if: always() && needs.resolve-version.result == 'success' && (needs.create-draft-release.result == 'success' || needs.create-draft-release.result == 'skipped')
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version into files
        run: node scripts/sync-version.mjs --version ${{ env.VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform, build-tools, NDK, CMake
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Write local.properties
        working-directory: apps/console/android
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125"
          } > local.properties

      - name: Prepare Console local host (libnode + server assets)
        run: node apps/console/scripts/prepare-local-host.mjs

      - name: Build Console web assets
        run: |
          pnpm --filter @stagesync/shared build
          if [ ! -f apps/web/dist-console/index.html ]; then
            pnpm --filter @stagesync/web build
          fi
          test -f apps/web/dist-console/index.html

      - name: Assemble Console release APK
        working-directory: apps/console/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name artifact
        run: |
          set -euo pipefail
          SRC="apps/console/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            SRC="apps/console/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          DEST="StageSync-Console-v${VERSION}.apk"
          cp "$SRC" "$DEST"
          ls -la "$DEST"

      - name: Upload Console APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-console-apk
          path: StageSync-Console-v${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          gh release upload "$TAG" "StageSync-Console-v${VERSION}.apk" -R "${{ github.repository }}" --clobber

  github-release:
    name: github-release
    runs-on: ubuntu-latest
    needs:
      [
        resolve-version,
        docker,
        create-draft-release,
        tauri-macos,
        tauri-windows,
        android-performer,
        android-console,
      ]
    if: >
      always() &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) &&
      needs.resolve-version.result == 'success' &&
      needs.create-draft-release.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.tauri-macos.result == 'success' &&
      needs.tauri-windows.result == 'success'
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-msi
          path: dist/

      - name: Download Performer APK
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: android-performer-apk
          path: dist/

      - name: Download Console APK
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: android-console-apk
          path: dist/

      - name: Rename MSI and align release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ env.VERSION }}"
          REPO="${{ github.repository }}"
          MSI_NAME="StageSync_${{ env.VERSION }}_x64.msi"
          cd dist
          shopt -s nullglob
          # Normalize any WiX locale / arch suffix → canonical StageSync_VERSION_x64.msi
          for f in *.msi; do
            case "$f" in
              *.sig) continue ;;
            esac
            normalized="$(echo "$f" | sed -E 's/_[a-z]{2}-[A-Z]{2}\.msi$/.msi/; s/_x86_64\./_x64./')"
            if [ "$normalized" != "$f" ]; then
              mv "$f" "$normalized"
              echo "Renamed $f → $normalized"
              f="$normalized"
            fi
            if [ "$f" != "$MSI_NAME" ]; then
              mv "$f" "$MSI_NAME"
              echo "Canonicalized → $MSI_NAME"
            fi
          done
          # Drop stale locale-suffixed assets Tauri may have uploaded earlier.
          for stale in \
            "StageSync_${{ env.VERSION }}_x64_en-US.msi" \
            "StageSync_${{ env.VERSION }}_x64_pl-PL.msi" \
            "StageSync_${{ env.VERSION }}_x86_64.msi" \
            "StageSync_${{ env.VERSION }}_x86_64_en-US.msi" \
            "StageSync_${{ env.VERSION }}_x86_64_pl-PL.msi"
          do
            gh release delete-asset "$TAG" "$stale" -R "$REPO" --yes 2>/dev/null || true
            gh release delete-asset "$TAG" "${stale}.sig" -R "$REPO" --yes 2>/dev/null || true
          done
          if [ -f "$MSI_NAME" ]; then
            gh release upload "$TAG" "$MSI_NAME" -R "$REPO" --clobber
            echo "Uploaded $MSI_NAME"
            if [ -f "${MSI_NAME}.sig" ]; then
              gh release upload "$TAG" "${MSI_NAME}.sig" -R "$REPO" --clobber
            fi
          else
            echo "ERROR: $MSI_NAME missing after rename" >&2
            ls -la *.msi || true
            exit 1
          fi
          # Point latest.json Windows updater URLs at the friendly MSI asset
          # (Tauri uploads locale-suffixed MSI first; rewrite after canonicalize).
          if gh release download "$TAG" -R "$REPO" -p latest.json -D . 2>/dev/null; then
            MSI_ID=$(gh release view "$TAG" -R "$REPO" --json assets \
              --jq ".assets[] | select(.name==\"$MSI_NAME\") | .apiUrl" \
              | sed 's#.*/assets/##')
            if [ -n "$MSI_ID" ]; then
              NEW_URL="https://api.github.com/repos/${REPO}/releases/assets/${MSI_ID}"
              # jq (not a column-0 heredoc) — unindented <<'PY' breaks Actions YAML parse
              jq --arg url "$NEW_URL" '
                .platforms |= with_entries(
                  if (.key | contains("windows")) and .value.url != $url
                  then .value.url = $url
                  else .
                  end
                )
              ' latest.json > latest.json.tmp
              if ! cmp -s latest.json latest.json.tmp; then
                mv latest.json.tmp latest.json
                gh release upload "$TAG" latest.json -R "$REPO" --clobber
                echo "Updated latest.json MSI asset URLs -> $NEW_URL"
              else
                rm -f latest.json.tmp
                echo "latest.json windows urls already current"
              fi
            else
              echo "WARN: $MSI_NAME not found on release — latest.json unchanged"
            fi
          fi

      - name: Publish android-latest.json for APK update prompts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          REPO: ${{ github.repository }}
          BASE: https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          python3 -c "import json,os; v=os.environ['VERSION']; b=os.environ['BASE']; json.dump({'version':v,'consoleUrl':f'{b}/StageSync-Console-v{v}.apk','performerUrl':f'{b}/StageSync-Performer-v{v}.apk'}, open('android-latest.json','w'), separators=(',',':'))"
          gh release upload "$TAG" android-latest.json -R "$REPO" --clobber
          echo "Uploaded android-latest.json for $TAG"

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.dmg *.msi *.apk 2>/dev/null | tee SHA256SUMS.txt || sha256sum *.dmg *.msi > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ env.VERSION }}"
          REPO="${{ github.repository }}"
          NOTES_FILE="$(mktemp)"
          node scripts/build-release-notes.mjs "${{ env.VERSION }}" > "$NOTES_FILE"
          TITLE="$(node scripts/release-title.mjs "${{ env.VERSION }}")"

          gh release upload "$TAG" dist/SHA256SUMS.txt -R "$REPO" --clobber

          gh release edit "$TAG" \
            -R "$REPO" \
            --draft=false \
            --latest \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE"
