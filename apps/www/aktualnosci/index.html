<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Przegląd wydań StageSync — najważniejsze funkcje linii v5.2, v5.1 i v5.0."
    />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StageSync" />
    <meta property="og:title" content="Co nowego w StageSync" />
    <meta
      property="og:description"
      content="Najważniejsze funkcje i usprawnienia wprowadzone w kolejnych wydaniach systemu."
    />
    <meta property="og:url" content="https://negatywistczny.github.io/stagesync/aktualnosci/" />
    <meta
      property="og:image"
      content="https://negatywistczny.github.io/stagesync/og-image.jpg?v=2"
    />
    <meta
      property="og:image:secure_url"
      content="https://negatywistczny.github.io/stagesync/og-image.jpg?v=2"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StageSync — Live Show Control - w rytmie koncertu" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Co nowego w StageSync" />
    <meta
      name="twitter:description"
      content="Najważniejsze funkcje i usprawnienia wprowadzone w kolejnych wydaniach systemu."
    />
    <meta
      name="twitter:image"
      content="https://negatywistczny.github.io/stagesync/og-image.jpg?v=2"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%brand/stagesync-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Co nowego w StageSync</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Przejdź do treści</a>

    <header class="topbar">
      <div class="shell topbar__inner">
        <a class="topbar__brand" data-brand href="/" aria-label="StageSync — strona główna">
          <img src="%BASE_URL%brand/stagesync-logo.svg" alt="" width="160" height="38" />
        </a>
        <nav class="topbar__nav" data-nav aria-label="Główne"></nav>
      </div>
    </header>

    <main id="main" class="news-page">
      <div class="shell">
        <header class="news-page__head">
          <p class="news-page__eyebrow">Przegląd wydań</p>
          <h1 class="news-page__title" id="news-title">
            Co nowego w <span class="brand-name"><span class="brand-name__stage">Stage</span><span class="brand-name__sync">Sync</span></span>
          </h1>
          <p class="news-page__lede">
            Najważniejsze funkcje i usprawnienia wprowadzone w kolejnych wydaniach systemu.
          </p>
        </header>
        <ul class="release-list" id="news-list" aria-labelledby="news-title"></ul>
      </div>
    </main>

    <footer class="footer">
      <div class="shell footer__inner">
        <img src="%BASE_URL%brand/stagesync-mark.svg" alt="" width="28" height="28" />
        <p>
          <span class="brand-name"><span class="brand-name__stage">Stage</span><span class="brand-name__sync">Sync</span></span>
          · Live Show Control - w rytmie koncertu · <a href="%BASE_URL%">Start</a>
        </p>
      </div>
    </footer>

    <script type="module" src="/src/news-list.ts"></script>
  </body>
</html>
