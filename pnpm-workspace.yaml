packages:
  - "apps/*"
  - "packages/*"
  - 'packages/deprecated-v4-bridge'
# pnpm 11 defaults to 1440m; keep 0 so fresh lockfile entries from
# `pnpm update --latest` remain installable in CI without waiting a day.
minimumReleaseAge: 0
# pnpm 10+ requires injected workspace deps for `pnpm deploy`; keep legacy
# deploy for desktop sidecar + Console local-host packaging.
forceLegacyDeploy: true
# Avoid TTY prompt when install switches away from deploy --prod state.
confirmModulesPurge: false
allowBuilds:
  "@julusian/midi": true
  esbuild: true
  gl: true
# eslint-plugin-react@7 peers ESLint ≤9; flat config still works on ESLint 10.
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-react>eslint": "10"
